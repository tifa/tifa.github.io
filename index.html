  <meta charset="utf-8">

  <title>tifa.dev</title>
  <meta name="description" content="Small tools and projects.">
  <link rel="icon" href="/mona-whisper.gif" type="image/gif">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1b2340;
      --muted: #5b6585;
      --border: #dfe4f0;
      --accent: #2557c4;
      --accent-soft: #e6edfb;
      --shadow: 0 1px 2px rgba(20, 30, 70, .06), 0 4px 16px rgba(20, 30, 70, .06);
      --shadow-hover: 0 2px 4px rgba(20, 30, 70, .08), 0 8px 24px rgba(20, 30, 70, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1424;
        --card: #171e33;
        --text: #e7ebf7;
        --muted: #9aa4c2;
        --border: #263052;
        --accent: #7ea2ff;
        --accent-soft: #1f2a4a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
        --shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 16px 32px;
    }
    main { width: 100%; max-width: 560px; }
    header { text-align: center; margin-bottom: 40px; }
    .avatar {
      width: 112px;
      height: 112px;
      image-rendering: pixelated;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 1px solid var(--border);
    }
    .avatar-link { display: inline-block; border-radius: 50%; }
    .avatar-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .avatar { transition: transform .2s; }
    .avatar-link:hover .avatar { transform: scale(1.05); }
    h1 {
      margin: 16px 0 4px;
      font: 600 28px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: -.01em;
    }
    .tagline { margin: 0; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: box-shadow .15s, transform .15s;
    }
    a.card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--c);
      color: #fff;
    }
    .icon svg { width: 22px; height: 22px; }
    .tree { --c: #5f9478; }
    .mail { --c: #8577b3; }
    .salt { --c: #c98455; }
    a.card:hover .icon { transform: rotate(-6deg) scale(1.05); }
    .icon { transition: transform .2s; }
    .body { flex: 1; min-width: 0; }
    .name { font-weight: 600; }
    .host {
      font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--c, var(--accent));
    }
    .desc { color: var(--muted); font-size: 14px; }
    .arrow { flex: none; color: var(--muted); transition: transform .15s, color .15s; }
    a.card:hover .arrow { color: var(--accent); transform: translateX(3px); }
    footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--accent); text-decoration: underline; }
    footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) {
      a.card, .arrow, .icon, .avatar { transition: none; }
      a.card:hover, a.card:hover .arrow, a.card:hover .icon, .avatar-link:hover .avatar { transform: none; }
    }
  </style>
</head>
<body>

      <h1>tifa.dev</h1>

    </header>

          </span>
          <span class="body">

            <span class="desc">Shared recipes.</span>

      </li>

          <span class="icon mail" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          </span>
          <span class="body">
            <span class="name">Mail</span> · <span class="host">mail.tifa.dev</span><br>
            <span class="desc">Virtual forwarders and mail management.</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>

      </li>
      <li>
        <a class="card tree" href="https://tree.tifa.dev">
          <span class="icon tree" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-2.5a1.5 1.5 0 0 1 1.5-1.5h11a1.5 1.5 0 0 1 1.5 1.5V17"/></svg>
          </span>
          <span class="body">
            <span class="name">Family Tree</span> · <span class="host">tree.tifa.dev</span><br>
            <span class="desc">Family pedigree and genealogy.</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </main>
